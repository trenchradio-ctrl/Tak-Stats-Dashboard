name: Update games database

on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-games-db
  cancel-in-progress: false

jobs:
  update-games-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild slim games database
        run: npm run update-db

      - name: Commit updated database
        run: |
          if git diff --quiet -- public/games.db; then
            echo "No games database changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games.db
          git commit -m "Update slim games database"
          git push
