name: Update games database

on:
  schedule:
    - cron: '17 9 * * *'
    - cron: '47 15 * * *'
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-games-db
  cancel-in-progress: false

jobs:
  update-games-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether an update is needed
        id: update-check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_update="$(git log -1 --format=%cI -- public/games.db || true)"
          today="$(date -u +%F)"

          if [[ "$last_update" == "$today"* ]]; then
            echo "public/games.db was already updated today: $last_update"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last public/games.db update: ${last_update:-never}"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.update-check.outputs.should_update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.update-check.outputs.should_update == 'true'
        run: npm ci

      - name: Rebuild slim games database
        if: steps.update-check.outputs.should_update == 'true'
        run: npm run update-db

      - name: Commit updated database
        if: steps.update-check.outputs.should_update == 'true'
        run: |
          if git diff --quiet -- public/games.db; then
            echo "No games database changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games.db
          git commit -m "Update slim games database"
          git push
